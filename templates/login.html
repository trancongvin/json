<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Kiro Checker</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f7; }
    .card { max-width: 320px; margin: 6rem auto; background: #fff; padding: 2rem;
            border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.08); }
    h2 { margin-top: 0; }
    input { width: 100%; padding: .6rem; font-size: 1rem; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; margin-top: .8rem; padding: .6rem; font-size: 1rem;
             background: #111; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    .err { color: #c00; margin: .6rem 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 Kiro Checker</h2>
    <form method="post">
      <input type="password" name="password" placeholder="Mật khẩu" autofocus>
      <button>Vào</button>
      {% if err %}<p class="err">{{ err }}</p>{% endif %}
    </form>
  </div>
</body>
</html>
